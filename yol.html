<!doctype html><html lang="uz"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>TEMIRCHI — Yetkazib berish</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#e8eaed}
#map{position:fixed;top:0;left:0;right:0;bottom:0}
.float-top{position:fixed;top:14px;left:14px;right:14px;z-index:500;display:flex;gap:10px;pointer-events:none}
.fbtn{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:auto;border:none;cursor:pointer;color:#1a1a1a}
.brand{background:#fff;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.18);padding:10px 16px;display:flex;align-items:center;gap:8px;pointer-events:auto}
.brand b{font-size:15px;color:#1a1a1a}.brand b i{color:#1DB93C;font-style:normal}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;background:#fff;border-radius:22px 22px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.15)}
.handle{width:38px;height:4px;background:#dcdcdc;border-radius:3px;margin:0 auto 16px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#e8f5e9;color:#1B8A3A;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:12px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#1DB93C;animation:p 1.5s infinite}
@keyframes p{50%{opacity:.3}}
.eta-line{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.eta-main{font-size:24px;font-weight:800;color:#1a1a1a}
.eta-plate{background:#f2f2f0;border-radius:8px;padding:7px 13px;font-weight:800;font-size:15px;color:#1a1a1a;white-space:nowrap}
.eta-sub{font-size:14px;color:#8a8a8a;margin-bottom:16px}
.drv-card{display:flex;align-items:center;gap:14px;padding:14px;background:#f7f7f5;border-radius:16px}
.drv-av{width:52px;height:52px;border-radius:50%;background:#FCE000;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.drv-name{font-weight:700;font-size:16px;color:#1a1a1a}
.drv-sub{color:#8a8a8a;font-size:13px;margin-top:2px}
.call-btn{width:50px;height:50px;border-radius:50%;background:#1DB93C;display:flex;align-items:center;justify-content:center;font-size:24px;border:none;cursor:pointer;flex:none;text-decoration:none;box-shadow:0 3px 10px rgba(29,185,60,.4)}
.done .eta-main{color:#1B8A3A}
.car-marker{background:#1a1a1a;border-radius:9px;padding:5px 7px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.dest-marker{width:20px;height:20px;border-radius:50%;background:#1a1a1a;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style></head>
<body>
<div id="map"></div>
<div class="float-top">
  <div class="brand"><span>🚚</span><b>TEMIR<i>CHI</i></b></div>
  <div style="flex:1"></div>
  <button class="fbtn" onclick="if(map&&drvLL)map.panTo(drvLL)">◎</button>
</div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="pill" id="pill"><span class="dot"></span>Haydovchi yo'lda</div>
  <div class="eta-line">
    <div class="eta-main" id="etaMain">Hisoblanmoqda…</div>
    <div class="eta-plate" id="plate">—</div>
  </div>
  <div class="eta-sub" id="etaSub">Manzilgacha masofa</div>
  <div class="drv-card">
    <div class="drv-av">🚚</div>
    <div style="flex:1">
      <div class="drv-name" id="drvName">Haydovchi</div>
      <div class="drv-sub" id="drvSub">📦 Mahsulotingiz yo'lda</div>
    </div>
    <a class="call-btn" id="callBtn" style="display:none">📞</a>
  </div>
</div>
<script>
const TOKEN=location.pathname.split('/').filter(Boolean).pop();
const LIGHT='https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png';
const OSM='https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
let map,drvM,cliM,routeLine,routeBg,drvLL=null,done=false,cliLL=null;
const carIcon=L.divIcon({className:'',html:'<div style="filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><svg width="48" height="34" viewBox="0 0 48 34"><ellipse cx="24" cy="31" rx="17" ry="3" fill="rgba(0,0,0,.15)"/><rect x="3" y="9" width="26" height="15" rx="2.5" fill="#F5A623"/><rect x="3" y="9" width="26" height="5" rx="2.5" fill="#E8951C"/><rect x="29" y="12" width="13" height="12" rx="2.5" fill="#EE5A3A"/><rect x="31" y="14" width="8" height="5" rx="1.5" fill="#BEE3F8"/><circle cx="12" cy="26" r="4" fill="#2D2D2D"/><circle cx="12" cy="26" r="1.8" fill="#888"/><circle cx="34" cy="26" r="4" fill="#2D2D2D"/><circle cx="34" cy="26" r="1.8" fill="#888"/></svg></div>',iconSize:[48,34],iconAnchor:[24,28]});
const destIcon=L.divIcon({className:'',html:'<div class="dest-marker"></div>',iconSize:[20,20],iconAnchor:[10,10]});
function initMap(lat,lon){
  map=L.map('map',{zoomControl:false,attributionControl:false}).setView([lat,lon],14);
  const light=L.tileLayer(LIGHT,{maxZoom:20,subdomains:'abcd'});
  let err=0; light.on('tileerror',function(){ if(err++<2){map.removeLayer(light);L.tileLayer(OSM,{maxZoom:19}).addTo(map);} });
  light.addTo(map);
}
async function osrm(a,b){
  try{
    const u='https://router.project-osrm.org/route/v1/driving/'+a[1]+','+a[0]+';'+b[1]+','+b[0]+'?overview=full&geometries=geojson';
    const r=await fetch(u); const d=await r.json();
    if(d.routes&&d.routes[0]) return {coords:d.routes[0].geometry.coordinates.map(function(c){return [c[1],c[0]];}),dur:d.routes[0].duration,dist:d.routes[0].distance};
  }catch(e){}
  return null;
}
async function tick(){
  let d; try{ const r=await fetch('/api/yol?token='+TOKEN); d=await r.json(); }catch(e){ return; }
  if(!d.ok){ document.getElementById('etaMain').textContent='Havola topilmadi'; return; }
  document.getElementById('drvName').textContent=d.ism||'Haydovchi';
  document.getElementById('plate').textContent=d.raqam||'';
  if(d.tel){ var cb=document.getElementById('callBtn'); cb.href='tel:'+d.tel; cb.style.display='flex'; }
  const mij=d.mijoz, nuq=d.haydovchi;
  if(!map && mij){ initMap(mij.lat,mij.lon); cliLL=[mij.lat,mij.lon]; }
  if(mij && !cliM && map){ cliM=L.marker([mij.lat,mij.lon],{icon:destIcon}).addTo(map).bindTooltip('📍 Sizning manzilingiz',{permanent:false}); }
  if(d.holat==='yakunlandi' && !done){
    done=true;
    document.getElementById('sheet').classList.add('done');
    document.getElementById('etaMain').textContent='✅ Yetib bordi';
    document.getElementById('plate').textContent='';
    document.getElementById('etaSub').textContent='Haydovchi manzilga yetib keldi';
    document.getElementById('pill').innerHTML='✅ Yetkazildi';
    document.getElementById('drvSub').textContent='Rahmat!';
    return;
  }
  if(nuq && map){
    drvLL=[nuq.lat,nuq.lon];
    if(!drvM){ drvM=L.marker(drvLL,{icon:carIcon,zIndexOffset:1000}).addTo(map); }
    else drvM.setLatLng(drvLL);
    if(cliLL){
      const rt=await osrm(drvLL,cliLL);
      if(rt){
        if(routeBg) map.removeLayer(routeBg);
        if(routeLine) map.removeLayer(routeLine);
        routeBg=L.polyline(rt.coords,{color:'#1a1a1a',weight:9,opacity:.2,lineCap:'round'}).addTo(map);
        routeLine=L.polyline(rt.coords,{color:'#1DB93C',weight:6,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(map);
        const daq=Math.max(1,Math.round(rt.dur/60)), km=(rt.dist/1000).toFixed(1);
        document.getElementById('etaMain').textContent="Yo'lda: ~"+daq+' daqiqa';
        document.getElementById('etaSub').textContent='Manzilgacha '+km+' km';
        try{ map.fitBounds(L.latLngBounds([drvLL,cliLL]),{padding:[80,80]}); }catch(e){}
      }
    }
  }
}
tick(); setInterval(tick,8000);
</script></body></html>
