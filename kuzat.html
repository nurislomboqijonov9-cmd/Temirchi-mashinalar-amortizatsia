<style>

.offbadge{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:12;background:#3a2412;border:1px solid #a0621e;color:#f0b464;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;display:none}
/* Pul modal */

</style></head>
<body>
<!-- KIRISH (kod) -->
<div id="kirish" style="position:fixed;inset:0;z-index:50;background:#0f1720;display:none;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center">
  <div style="width:72px;height:72px;border-radius:18px;background:#16294A;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:16px">🚚</div>

<div id="map"></div>
<div class="top">

  <div><div class="tt">TEMIR<b>CHI</b></div><div style="font-size:11px;color:#8aa0a8" id="nm">Kuzatuv</div></div>

</div>
<div class="offbadge" id="offbadge">📴 Internetsiz — saqlanmoqda (<span id="offn">0</span>)</div>
<div class="warn" id="warn"></div>

<div class="card">
  <div class="stat">
    <div><div class="v on" id="s_holat">Yoniq</div><div class="l">GPS</div></div>
    <div><div class="v" id="s_km">0.0</div><div class="l">km (bugun)</div></div>

</div>

<!-- PUL MODAL -->
<div class="pmodal" id="pmodal">
  <div class="psheet">
    <h3>➕ Yozuv qo'shish <button class="x" onclick="closePul()">✕</button></h3>
    <div class="ptypes" id="ptypes"></div>
    <div id="naqdBox" class="pnaqd">
      <button class="on" data-pul="naqd" onclick="setPul('naqd')">🟢 Naqd keldi</button>
      <button data-pul="bonus" onclick="setPul('bonus')">🟡 Ish qildi (pul kelmadi)</button>
    </div>
    <div class="qtez">
      <button onclick="setAmt(100000)">100k</button>
      <button onclick="setAmt(150000)">150k</button>
      <button onclick="setAmt(200000)">200k</button>
    </div>
    <input class="pf" id="pAmt" inputmode="numeric" placeholder="Summa (so'm)">
    <input class="pf" id="pNote" placeholder="Izoh (ixtiyoriy)">
    <button class="psave" onclick="savePul()">✅ Yuborish</button>
    <div style="text-align:center;color:#8aa0a8;font-size:12px;margin-top:10px">Rahbar tasdiqlaydi. Internetsiz bo'lsa — keyin yuboriladi.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ==== TOKEN ====
let TOKEN=(function(){
  const parts=location.pathname.split('/').filter(Boolean);
  const last=parts[parts.length-1];
  if(last && last!=='kuzat' && last!=='kuzat.html'){ try{localStorage.setItem('hayd_token',last);}catch(e){} return last; }
  try{ return localStorage.getItem('hayd_token')||''; }catch(e){ return ''; }
})();
const $=id=>document.getElementById(id);
let watchId=null, wake=null, lastP=null, lastT=0, tracking=false;
let map=null, marker=null, acirc=null, trail=null, tpts=[], kmSum=0, prevLL=null, birinchi=true, lastKmT=0;
// GPS silliqlash (Kalman-lite) — uchishni yo'qotadi
let kf={lat:null,lon:null,variance:-1};
function kalman(lat,lon,acc,tms){
  const Q=3; // metr/sek — harakat "shovqini"
  if(kf.variance<0){ kf.lat=lat; kf.lon=lon; kf.variance=acc*acc; kf.t=tms; return {lat,lon}; }
  const dt=Math.max(0,(tms-kf.t)/1000); kf.t=tms;
  kf.variance += dt*Q*Q;
  const K = kf.variance/(kf.variance + acc*acc); // Kalman gain
  kf.lat += K*(lat-kf.lat);
  kf.lon += K*(lon-kf.lon);
  kf.variance = (1-K)*kf.variance;
  return {lat:kf.lat, lon:kf.lon};
}

// ==== OFFLINE saqlash (IndexedDB - ko'p sig'adi, ishonchli) ====
let idb=null;
function idbInit(){
  return new Promise(res=>{
    try{
      const rq=indexedDB.open('temirchi_gps',1);
      rq.onupgradeneeded=e=>{ const db=e.target.result;
        if(!db.objectStoreNames.contains('pts')) db.createObjectStore('pts',{keyPath:'k',autoIncrement:true});
        if(!db.objectStoreNames.contains('pul')) db.createObjectStore('pul',{keyPath:'k',autoIncrement:true});
      };
      rq.onsuccess=e=>{ idb=e.target.result; res(true); };
      rq.onerror=()=>res(false);
    }catch(e){ res(false); }
  });
}
function idbAdd(store,val){ return new Promise(res=>{ if(!idb)return res(false);
  try{ const tx=idb.transaction(store,'readwrite'); tx.objectStore(store).add(val); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);}catch(e){res(false);} }); }
function idbAll(store){ return new Promise(res=>{ if(!idb)return res([]);
  try{ const tx=idb.transaction(store,'readonly'); const rq=tx.objectStore(store).getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>res([]);}catch(e){res([]);} }); }
function idbClear(store,keys){ return new Promise(res=>{ if(!idb)return res(false);
  try{ const tx=idb.transaction(store,'readwrite'); const os=tx.objectStore(store); keys.forEach(k=>os.delete(k)); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);}catch(e){res(false);} }); }

function dist(a,b){ if(!a||!b)return 1e9; const R=6371000,r=x=>x*Math.PI/180;
  const d1=r(b.lat-a.lat),d2=r(b.lon-a.lon),h=Math.sin(d1/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(d2/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h))); }
function tkVaqt(){ const d=new Date(); const tk=new Date(d.getTime()+(d.getTimezoneOffset()+300)*60000);
  const p=n=>String(n).padStart(2,'0');
  return tk.getFullYear()+'-'+p(tk.getMonth()+1)+'-'+p(tk.getDate())+'T'+p(tk.getHours())+':'+p(tk.getMinutes())+':'+p(tk.getSeconds()); }

function trukSvg(){
  return '<div style="filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))">'+
    '<svg width="48" height="34" viewBox="0 0 48 34">'+
    '<ellipse cx="24" cy="31" rx="17" ry="3" fill="rgba(0,0,0,.15)"/>'+  // soya
    '<rect x="3" y="9" width="26" height="15" rx="2.5" fill="#F5A623"/>'+  // kuzov (sariq)
    '<rect x="3" y="9" width="26" height="5" rx="2.5" fill="#E8951C"/>'+   // kuzov tepa
    '<rect x="29" y="12" width="13" height="12" rx="2.5" fill="#EE5A3A"/>'+ // kabina (qizil)
    '<rect x="31" y="14" width="8" height="5" rx="1.5" fill="#BEE3F8"/>'+  // oyna
    '<circle cx="12" cy="26" r="4" fill="#2D2D2D"/><circle cx="12" cy="26" r="1.8" fill="#888"/>'+  // g'ildirak
    '<circle cx="34" cy="26" r="4" fill="#2D2D2D"/><circle cx="34" cy="26" r="1.8" fill="#888"/>'+  // g'ildirak
    '</svg></div>';
}
function initMap(){
  try{
    if(typeof L==='undefined') return;
    map=L.map('map',{zoomControl:false,attributionControl:false}).setView([41.311,69.24],15);
    // Ko'cha — CartoDB (sifatli), yuklanmasa OpenStreetMap (ishonchli)
    const kocha=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{maxZoom:20,subdomains:'abcd'});
    let xato=0;
    kocha.on('tileerror',()=>{ if(xato++<2){ map.removeLayer(kocha); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map); } });
    kocha.addTo(map);
    // Sputnik (yo'ldosh rasm — Esri)
    const sput=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20});
    const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});
    L.control.layers({"🗺 Ko'cha":kocha,"🛰 Sputnik":sput,"🗺 OSM":osm},null,{position:'topright'}).addTo(map);
    trail=L.polyline([],{color:'#2a6df0',weight:5,opacity:.9,lineJoin:'round',lineCap:'round'}).addTo(map);
  }catch(e){ map=null; }
}
function chiz(pt){
  $('s_vaqt').textContent=pt.vaqt.slice(11,16);
  const ll=[pt.lat,pt.lon];
  // km faqat ISHONCHLI harakatда qo'shiladi (sakrашni hisoblamaymiz)
  if(prevLL){
    const m = dist({lat:prevLL[0],lon:prevLL[1]},pt);  // metrda
    const dt = (lastKmT ? (Date.now()-lastKmT)/1000 : 999); // sekund
    const tezlik = dt>0 ? m/dt : 0;  // m/s
    // qo'shamiz agar: 8m dan ko'p yurgan VA aniqlik yaxshi (<=60m) VA tezlik real (<40 m/s = 144 km/soat)
    if(m>=8 && (pt.acc||0)<=60 && tezlik<40){
      kmSum += m/1000;
    }
  }
  lastKmT=Date.now();
  prevLL=ll; tpts.push(ll);
  $('s_km').textContent=kmSum.toFixed(1);
  if(!map || typeof L==='undefined') return;
  try{
    if(!marker){
      marker=L.marker(ll,{icon:L.divIcon({className:'',html:trukSvg(),iconSize:[48,34],iconAnchor:[24,28]})}).addTo(map);
      acirc=L.circle(ll,{radius:pt.acc||20,color:'#39d98a',weight:1,fillColor:'#39d98a',fillOpacity:.1}).addTo(map);
    }else{ marker.setLatLng(ll); acirc.setLatLng(ll); acirc.setRadius(pt.acc||20); }
    if(trail) trail.setLatLngs(tpts);
    if(birinchi){ map.setView(ll,16); birinchi=false; } else map.panTo(ll,{animate:true});
  }catch(e){}
}
async function onPos(p){
  const now=Date.now(); const acc=Math.round(p.coords.accuracy||0);
  const rang=acc<=30?'#39d98a':(acc<=100?'#f0c674':'#e06a6a');
  $('acc').innerHTML="<span style='color:"+rang+"'>● "+acc+" m</span>";
  // juda noaniq (500m+) bo'lsagina tashlaymiz
  if(acc>500){ return; }
  // GPS SILLIQLASH — uchishni yo'qotadi
  const s=kalman(p.coords.latitude, p.coords.longitude, Math.max(acc,10), now);
  const pt={lat:s.lat,lon:s.lon,vaqt:tkVaqt(),acc:acc};
  // SAKRASH aniqlash: oldingi ishonchli nuqtadan juda tez uzoqlashsa (imkonsiz) — tashlaymiz
  if(lastP){
    const m=dist(lastP,pt); const dt=(now-lastT)/1000;
    const tez = dt>0 ? m/dt : 999;
    if(tez>50 && acc>50){ return; }
  }
  // bir joyda turган bo'lsa (15m ичida) va 12 sekunddan kam — takror yozmaymiz
  if(lastP && (now-lastT)<12000 && dist(lastP,pt)<15){ return; }
  lastP=pt; lastT=now;
  await idbAdd('pts',pt);
  chiz(pt); hideWarn(); flush();
}
function onErr(e){
  if(e.code===1){ showWarn("⚠️ Joylashuvga ruxsat berilmagan. Sozlamalardan yoqing."); }
  else if(e.code===2){ showWarn("⚠️ GPS signal yo'q. Ochiq joyga chiqing."); }
  else if(e.code===3){ showWarn("⏳ GPS qidirilmoqda... ochiq joyga chiqing."); }
}

// ==== FLUSH — GPS nuqtalarni serverga yuborish (offline bo'lsa saqlaydi) ====
let offlineCount=0;
async function flush(){
  const items=await idbAll('pts'); if(!items.length){ updateOff(0); return; }
  const points=items.map(x=>({lat:x.lat,lon:x.lon,vaqt:x.vaqt,acc:x.acc}));
  const keys=items.map(x=>x.k);
  try{
    const r=await fetch('/api/gps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,points})});
    if(r.ok){
      await idbClear('pts',keys); updateOff(0); flushPul();
      const d=await r.json().catch(()=>({}));
      handleYetkazish(d.yetkazish, points[points.length-1]);
    }
    else updateOff(items.length);
  }catch(e){ updateOff(items.length); }
}

// ==== YETKAZISH — mijozga yo'l ko'rsatish (Yandex kabi) ====
let mijozMk=null, yolLine=null, yolBg=null, yetkazishBox=null;
async function handleYetkazish(y, oxirgi){
  if(!y){
    // yetkazish yo'q — tozalash
    if(mijozMk&&map){ map.removeLayer(mijozMk); mijozMk=null; }
    if(yolLine&&map){ map.removeLayer(yolLine); yolLine=null; }
    if(yetkazishBox){ yetkazishBox.remove(); yetkazishBox=null; }
    return;
  }
  if(!map || typeof L==='undefined' || !oxirgi) return;
  // mijoz markeri — Yandex kabi qora nuqta
  const mll=[y.lat,y.lon];
  if(!mijozMk){ mijozMk=L.marker(mll,{icon:L.divIcon({className:'',html:'<div style="width:20px;height:20px;border-radius:50%;background:#1a1a1a;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map).bindTooltip('📍 Mijoz'+(y.izoh?': '+y.izoh:''),{permanent:false}); }
  else mijozMk.setLatLng(mll);
  // yo'l (OSRM) — Yandex kabi yashil, qora kant
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${oxirgi.lon},${oxirgi.lat};${y.lon},${y.lat}?overview=full&geometries=geojson`;
    const rr=await fetch(u); const dd=await rr.json();
    if(dd.routes&&dd.routes[0]){
      const coords=dd.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
      if(yolLine) map.removeLayer(yolLine);
      if(yolBg) map.removeLayer(yolBg);
      yolBg=L.polyline(coords,{color:'#1a1a1a',weight:9,opacity:.2,lineCap:'round'}).addTo(map);
      yolLine=L.polyline(coords,{color:'#1DB93C',weight:6,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(map);
      const daq=Math.max(1,Math.round(dd.routes[0].duration/60));
      const km=(dd.routes[0].distance/1000).toFixed(1);
      showYetkazish(daq,km,y.izoh);
    }
  }catch(e){}
}
function showYetkazish(daq,km,izoh){
  if(!yetkazishBox){
    yetkazishBox=document.createElement('div');
    yetkazishBox.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:22px 22px 0 0;padding:16px 20px 22px;box-shadow:0 -4px 24px rgba(0,0,0,.2)';
    document.body.appendChild(yetkazishBox);
  }
  yetkazishBox.innerHTML=`
    <div style="width:38px;height:4px;background:#dcdcdc;border-radius:3px;margin:0 auto 14px"></div>
    <div style="display:inline-flex;align-items:center;gap:6px;background:#e3f0ff;color:#1565c0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:12px">📦 Mijozga yetkazish</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div style="font-size:24px;font-weight:800;color:#1a1a1a">~${daq} daqiqa</div>
      <div style="background:#f2f2f0;border-radius:8px;padding:7px 13px;font-weight:800;font-size:15px;color:#1a1a1a">${km} km</div>
    </div>
    <div style="font-size:14px;color:#8a8a8a;margin-bottom:16px">📍 ${izoh||'Belgilangan manzil'}</div>
    <button onclick="yetkazishYetdi()" style="width:100%;padding:16px;border:none;border-radius:16px;background:#1DB93C;color:#fff;font-size:16px;font-weight:800;cursor:pointer">✅ Yetib keldim</button>`;
}
window.yetkazishYetdi=async function(){
  if(!confirm('Mijozga yetkazib berdingizmi?')) return;

// ==== START (doimiy kuzatuv) ====
async function start(){
  if(!navigator.geolocation){ showWarn("Bu qurilmada GPS yo'q."); return; }
  await idbInit();
  tracking=true;
  $('s_holat').textContent="Yoniq"; $('s_holat').className="v on";
  showWarn("⏳ GPS qidirilmoqda... biroz kuting");
  // birinchi joyni tez olish
  navigator.geolocation.getCurrentPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  if(!window._iv){ window._iv=true; setInterval(flush,20000); setInterval(ping,60000); setInterval(fonGps,15000); }
  ping(); flush();
  try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){}
  // Service worker + periodic background sync (fon uchun)
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('/sw-gps.js').catch(()=>null);
      if(reg){
        navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='flush'){ fonGps(); flush(); } });
        if('periodicSync' in reg){ try{ await reg.periodicSync.register('gps-flush',{minInterval:15000}); }catch(e){} }
      }
    }
  }catch(e){}
  keepAlive();  // audio keep-alive (fonda uxlamasin)
}

// FON GPS — ekran o'chsa ham har 15 sekundda joy so'raymiz
function fonGps(){
  if(!tracking) return;
  try{ navigator.geolocation.getCurrentPosition(onPos, ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:12000}); }catch(e){}
  // watchPosition ba'zan fonda o'ladi — qayta yoqamiz
  try{
    if(watchId!=null) navigator.geolocation.clearWatch(watchId);
    watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  }catch(e){}
}

// AUDIO keep-alive — jimjit ovoz LOOP, telefon "musiqa ijro etilyapti" deb fonda uxlamaydi
let audioCtx=null, silentAudio=null;
function keepAlive(){
  try{
    // 1-usul: WebAudio oscillator (jimjit)
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC && !audioCtx){
      audioCtx=new AC();
      const osc=audioCtx.createOscillator();
      const gain=audioCtx.createGain();
      gain.gain.value=0.0015; // deyarli eshitilmaydi, lekin tizim "ovoz bor" deydi
      osc.frequency.value=40;
      osc.type='sine';
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
    }
    // 2-usul: jimjit WAV loop (Media Session — eng kuchli, ekran o'chsa ham davom etadi)
    if(!silentAudio){
      silentAudio=new Audio(SILENT_WAV);
      silentAudio.loop=true;
      silentAudio.volume=0.01;
      silentAudio.play().catch(()=>{});
      // Media Session — "TEMIRCHI GPS yoniq" (tizim uni ushlab turadi)
      if('mediaSession' in navigator){
        try{
          navigator.mediaSession.metadata=new MediaMetadata({title:'TEMIRCHI — GPS yoniq',artist:'Haydovchi kuzatuvi'});
          navigator.mediaSession.setActionHandler('pause',()=>{ silentAudio.play().catch(()=>{}); });
        }catch(e){}
      }
    }
    // bosilganda tiklash
    document.addEventListener('click',()=>{
      if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
      if(silentAudio&&silentAudio.paused) silentAudio.play().catch(()=>{});
    });
    // audio to'xtasa qayta yoqamiz (har 10 sek tekshirish)
    setInterval(()=>{
      if(!tracking) return;
      if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
      if(silentAudio&&silentAudio.paused) silentAudio.play().catch(()=>{});
    },10000);
  }catch(e){}
}

// ==== PUL kiritish ====
const PT={
  yolkira:{i:'💵',n:"Yo'lkira",in:true}, gaz:{i:'⛽',n:'Gaz'}, ovqat:{i:'🍽',n:'Ovqat'},
  tamir:{i:'🔧',n:"Ta'mir"}, yuvish:{i:'🚿',n:'Yuvish'}, boshqa:{i:'📦',n:'Boshqa'}
};
let curType='yolkira', curPul='naqd';
function renderTypes(){
  $('ptypes').innerHTML=Object.keys(PT).map(k=>
    `<div class="pt${k===curType?' on':''}" data-t="${k}" onclick="setType('${k}')"><span class="i">${PT[k].i}</span>${PT[k].n}</div>`).join('');
  $('naqdBox').style.display = PT[curType].in ? 'flex' : 'none';
}
window.setType=function(k){ curType=k; renderTypes(); }
window.setPul=function(p){ curPul=p; document.querySelectorAll('#naqdBox button').forEach(b=>b.classList.toggle('on',b.dataset.pul===p)); }
window.setAmt=function(v){ $('pAmt').value=v; }
window.openPul=function(){ curType='yolkira'; curPul='naqd'; $('pAmt').value=''; $('pNote').value=''; renderTypes(); setPul('naqd'); $('pmodal').classList.add('on'); }
window.closePul=function(){ $('pmodal').classList.remove('on'); }
async function savePul(){
  const amt=parseInt(($('pAmt').value||'').replace(/\D/g,''));
  if(!amt||amt<=0){ toast('Summa kiriting'); return; }
  const rec={t:curType,amt,note:($('pNote').value||'').trim(),pul:(PT[curType].in?curPul:null),vaqt:tkVaqt()};
  await idbAdd('pul',rec);
  closePul(); toast('✅ Saqlandi — yuborilmoqda');
  flushPul();
}
async function flushPul(){
  const items=await idbAll('pul'); if(!items.length) return;
  for(const it of items){
    try{
      const r=await fetch('/api/gps_pul',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:TOKEN,t:it.t,amt:it.amt,note:it.note,pul:it.pul})});
      if(r.ok){ await idbClear('pul',[it.k]); }
    }catch(e){ break; } // internet yo'q — keyin
  }
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

// ==== KOD bilan kirish ====
async function kodKirish(){
  const k=($('kod').value||'').trim();
  if(k.length<6){ $('kodXato').textContent="6 xonali kodni kiriting"; return; }
  try{
    const r=await fetch('/api/kuzat_kirish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kod:k})});
    const d=await r.json();
    if(!d.ok){ $('kodXato').textContent=d.xato||"Kod noto'g'ri"; return; }
    try{ localStorage.setItem('hayd_token',d.token); }catch(e){}
    location.href='/kuzat';
  }catch(e){ $('kodXato').textContent="Ulanish yo'q"; }
}
$('kirBtn').onclick=kodKirish;
$('kod').addEventListener('keydown',e=>{ if(e.key==='Enter') kodKirish(); });
